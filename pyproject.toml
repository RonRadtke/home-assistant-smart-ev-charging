[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-smart-ev-charging"
version = "0.1.0"
description = "Deadline-first, price-optimized EV charging for Home Assistant"
requires-python = ">=3.14.2"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=smart_ev_charging.planner --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
