[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-smart-ev-charging"
version = "0.1.1"
description = "Deadline-first, price-optimized EV charging for Home Assistant"
requires-python = ">=3.14.2"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=1.0", "pytest-cov>=5.0", "ruff>=0.6", "homeassistant>=2026.8.0"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.smart_ev_charging" = ["*.json", "translations/*.json", "brand/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=custom_components.smart_ev_charging --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
