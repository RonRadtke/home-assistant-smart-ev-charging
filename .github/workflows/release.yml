name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease for supervised testing
        type: boolean
        default: true
      hardware_verified:
        description: The hardware acceptance checklist has been completed (required for stable releases)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release requirements and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          HARDWARE_VERIFIED: ${{ inputs.hardware_verified }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Releases must be created from main."
            exit 1
          fi
          if [ "$PRERELEASE" != true ] && [ "$HARDWARE_VERIFIED" != true ]; then
            echo "Complete docs/RELEASING.md before publishing a stable release."
            exit 1
          fi
          version=$(jq -r .version custom_components/smart_ev_charging/manifest.json)
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "Smart EV Charging $version" \
            --notes-file RELEASE_NOTES.md "${args[@]}"
