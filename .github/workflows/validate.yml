name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          if [ "$HA_VERSION" = latest ]; then
            python -m pip install -e '.[test]'
          else
            python -m pip install -e '.[test]' "homeassistant==$HA_VERSION"
          fi
      - run: ruff check custom_components tests
      - run: pytest
        if: success() || failure()

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
